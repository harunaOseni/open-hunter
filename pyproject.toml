[project]
name = "openhunter"
version = "0.1.0"
description = "Free, self-hosted public-data email discovery for targeted outreach."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "dnspython>=2.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
openhunter = "openhunter.cli:main"
openhunter-mcp = "openhunter.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
